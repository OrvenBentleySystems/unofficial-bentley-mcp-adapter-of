[project]
name = "staad-mcp-gateway"
version = "0.1.0"
description = "Local MCP adapters: authenticated read-only STAAD gateway and direct MicroStation/OpenBuildings COM bridge."
requires-python = ">=3.11,<3.14"
dependencies = [
    # Upstream Bentley server, pinned to the tag already used by the working CLI integration.
    "openstaad-mcp @ git+https://github.com/BentleySystems/openstaad-mcp@v1.3.0",
    "fastmcp>=3.2.3,<4",
    "uvicorn>=0.30",
    # Direct COM control for the local MicroStation/OpenBuildings bridge.
    "comtypes>=1.4,<2; sys_platform == 'win32'",
]

[project.scripts]
staad-mcp-gateway = "staad_mcp_gateway.app:main"
bentley-mcp = "bentley_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/staad_mcp_gateway", "src/bentley_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
