id: plaxis2d-output
display: PLAXIS 2D Output
version: 1.0.0
server:
  package: plaxis-mcp
  pinned: "0.3.5"
  distribution: "PyPI evaluation path; signed plaxis-mcp.exe required for production"
  launch:
    command: "${machine.executables.uvx}"
    args:
      - --offline
      - --python
      - "3.13"
      - --from
      - "plaxis-mcp==0.3.5"
      - plaxis-mcp
      - serve
      - --role
      - output
  transport: stdio
requires:
  application: PLAXIS 2D Output
  application_id: plaxis2d
  process_names: [Plaxis2DOutput.exe]
  min_version: "V22"
  verified_version: "2023.2.1.1079"
  version_policy:
    type: verified-or-upstream-generation
    verified_versions: ["2023.2.1.1079"]
    upstream_generation_from: "2024.2"
    newer_builds_verified: false
  version_record_key: PLAXIS version
  server_version_record_key: plaxis-mcp version
  runtime:
    upstream_current:
      profile: current-312
      python: "3.12.3"
      generation: "PLAXIS 2024.2 and newer"
      live_certification: unverified
    verified_local:
      profile: legacy-38-2023
      python: "3.8.17"
      generation: "PLAXIS 2D 2023.2"
      distribution: "locally patched; absent from stock plaxis-mcp 0.3.5"
      upstream_certified: false
  model_check: window_title
  model_title_reject: ["(Untitled)", "[Untitled]"]
network:
  uses_port: true
  host: 127.0.0.1
  default_port: 10001
  port_owner: application
  expected_process: Plaxis2DOutput.exe
  expected_identity: PLAXIS 2D Output
  conflicts_with: [plaxis3d-output]
preflight:
  - tool: connect
  - tool: connection_status
    expect: {connected: true}
  - tool: project_info
    expect_non_empty: [project_title, filename]
  - tool: list_result_types
tiers:
  read:
    - connect
    - connection_status
    - project_info
    - list_phases
    - list_materials
    - list_members
    - inspect
    - list_result_types
    - get_results
    - get_single_result
  guided: []
  full: ["*"]
never_auto_approve: []
compat:
  tested_clients: [copilot-cli, vscode-copilot]
  verified_clients: [copilot-cli]
inventory:
  verified_count: 11
